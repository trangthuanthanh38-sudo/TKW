<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cau5.html</title>
    <style>

         header{
            background-color: #2f63ff;
            color: white;
            display: flex;
            padding: 15px;
            justify-content: center;
            align-items: center;
        }

        .logo svg {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }

        h1{
            font-size: 26px;
            text-align: center;
        }

        .nav-container{
            display: flex;
            background-color: #2febff;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
        }

        .nav-item{
            padding: 14px 17px;
            color: black;
            cursor: pointer;
        }

        .nav-item a{
            text-decoration: none;
            color: black; 
        }

        .nav-item:hover{
            background-color: #ffe700;
        }

        .advert{
            width: 100%;
            height: 200px;
            border: 2px solid red;
            background-color: #00e56b;
            margin-top: 20px;
            text-align: center;
            line-height: 200px;
            transition: all 0.3s ease;
            font-size: 26px;
        }

        .advert:hover {
            background-color: #ffe700;
            border-color: #00e56b;
            font-style: italic;
        }

        .course-container{
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .course{
            width: 250px;
            height: auto;
            border: 2px solid #333;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: whitesmoke;
        }

        .course h2{
            color: #2c3e50;
        }

        .container{
            margin: 20px auto;
            background-color: white;
            padding: 25px;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;

            box-sizing: border-box;

        }

        .container h2{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group{
            margin-bottom: 15px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background-color: #218838;
        }

        /* Điện thoại */
        @media screen and (max-width: 414px){
            .container{
                max-width: 100%;
            }
        }

        /* Máy tính bảng */
        @media screen and (min-width: 415px) and (max-width: 1024px){
            .container{
                max-width: 700px;
            }
        }

        /* Máy tính */
        @media screen and (min-width: 1025px){
            .container{
                max-width: 500px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" stroke="white" stroke-width="3" fill="none"></circle>
                <text x="50%" y="60%" text-anchor="middle" font-size="24px" font-weight="bold" fill="white">EL</text>
            </svg>
        </div>

        <h1>English Learning</h1>
    </header>

    <div class="nav-container">
        <div class="nav-item"><a href="cau1.html">Trang chủ</a></div>
        <div class="nav-item"><a href="cau3.html">Khóa học</a></div>
        <div class="nav-item"><a href="cau2.html">Layout</a></div>
        <div class="nav-item"><a href="cau4.html">Đăng ký</a></div>
    </div>

    <div class="advert">Khuyến mãi 50% cho học viên đăng ký trong tháng 5!</div>

    <h1>Danh sách khóa học tiếng Anh</h1>

    <div id="course-list" class="course-container"></div>

    <div class="container">

        <h2>ĐĂNG KÝ KHÓA HỌC</h2>

        <form id="courseForm">

            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" id="fullname" placeholder="Nhập họ tên...">
            </div>

            <div class="form-group">
                <label>Địa chỉ email:</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="tel" id="phone" placeholder="Nhập số điện thoại...">
            </div>

            <div class="form-group">
                <label>Khóa học muốn đăng ký:</label>
                <select id="course">
                    <option value="">-- Chọn khóa học --</option>
                    <option value="web"> Lập trình Web </option>
                    <option value="network"> Quản trị mạng </option>
                    <option value="data"> Khoa học dữ liệu </option>
                </select>
            </div>

            <div class="form-group">
                <label>Thời gian ưu tiên học:</label>
                <input type="text" id="time" placeholder="Ví dụ: Sáng thứ 2, 4, 6">
            </div>

            <button type="submit"> Gửi đăng ký </button>

        </form>

    </div>

    <script>

        document.getElementById("courseForm").addEventListener("submit", function(e){

            e.preventDefault();

            let fullname = document.getElementById("fullname").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let course = document.getElementById("course").value;
            let time = document.getElementById("time").value.trim();

            if( fullname === "" ||email === "" ||phone === "" ||course === "" ||time === "")
            {
                alert("Vui lòng nhập đầy đủ thông tin!");
                return;
            }

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if(!emailPattern.test(email))
            {
                alert("Email không hợp lệ!");
                return;
            }

            let phonePattern =/^[0-9]{10}$/;

            if(!phonePattern.test(phone))
            {
                alert("Số điện thoại phải gồm 10 số!");
                return;
            }

            alert("Đăng ký khóa học thành công!");

        });

    </script>
    
    <script>

        // Chuỗi JSON gồm 4 đối tượng
        let jsonData = `[
            {
                "tenKhoaHoc": "Tiếng Anh Giao Tiếp",
                "moTa": "Khóa học giao tiếp cơ bản",
                "hocPhi": "2.000.000 VNĐ",
                "thoiGianKhaiGiang": "01/06/2026"
            },

            {
                "tenKhoaHoc": "IELTS Foundation",
                "moTa": "Luyện kỹ năng nền tảng",
                "hocPhi": "3.500.000 VNĐ",
                "thoiGianKhaiGiang": "10/06/2026"
            },

            {
                "tenKhoaHoc": "TOEIC 4 Kỹ Năng",
                "moTa": "Phát triển đầy đủ 4 kỹ năng",
                "hocPhi": "4.000.000 VNĐ",
                "thoiGianKhaiGiang": "15/06/2026"
            },

            {
                "tenKhoaHoc": "Tiếng Anh Cho DN",
                "moTa": "Tiếng Anh giao tiếp công sở",
                "hocPhi": "2.800.000 VNĐ",
                "thoiGianKhaiGiang": "20/06/2026"
            }
        ]`;

        // Chuyển JSON thành object
        let courses = JSON.parse(jsonData);

        let i = 0;

        // Lấy div hiển thị
        let courseList = document.getElementById("course-list");

        // Dùng vòng lặp while
        while(i < courses.length){

            courseList.innerHTML += `
                <div class="course">
                    <h2>${courses[i].tenKhoaHoc}</h2>
                    <p><strong>Mô tả: </strong>${courses[i].moTa}</p>
                    <p><strong>Học phí: </strong>${courses[i].hocPhi}</p>
                    <p><strong>Khai giảng: </strong>${courses[i].thoiGianKhaiGiang}</p>
                </div>
            `;
            i++;
        }
    </script>
    
</body>
</html>
